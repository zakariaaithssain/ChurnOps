name: KKBox Churn Prediction CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check src/ 
      - run: uv run ruff format --check src/ 
      - run: uv run mypy src/

