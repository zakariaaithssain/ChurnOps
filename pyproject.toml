[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "end-to-end MLOps Project for KKBox Churn Prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evidently>=0.7.23",
    "fastparquet>=2026.9.0",
    "git-filter-repo>=2.47.0",
    "iprogress>=0.4",
    "ipykernel>=7.4.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "mypy>=2.4.0",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pre-commit>=4.7.0",
    "psycopg[binary,pool]>=3.3.6",
    "ruff>=0.17.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
]

[tool.setuptools.packages.find]
where = ["src"]
packages = ["churn"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
]


[tool.mypy]
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "lightgbm.*", "evidently.*"]
ignore_missing_imports = true
