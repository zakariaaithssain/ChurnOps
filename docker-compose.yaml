services:
  postgres-db: 
    image: postgres:latest
    container_name: kkbox_db_container
    ports:
      - "5432:5432"
    volumes:
      - "kkbox_data:/var/lib/postgresql"
    environment:
      - POSTGRES_PASSWORD=postgrespass
      - POSTGRES_USER=kkbox
      - POSTGRES_DB=kkbox_data
    restart: unless-stopped
  
  pgadmin-web: 
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    container_name: pgadmin_container
    environment:
      - PGADMIN_DEFAULT_EMAIL=zakaria04aithssain@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=pgadminpass
    depends_on:
      - postgres-db

  
volumes:
  kkbox_data: